name: Build Linux Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build static Linux binaries (amd64 & arm64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/hangul-installer-linux-amd64 ./cmd/hangul-installer
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/hangul-installer-linux-arm64 ./cmd/hangul-installer
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hangul-installer-binaries
          path: dist/*

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
